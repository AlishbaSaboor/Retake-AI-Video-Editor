name: CI

# The quick checks, on every push to main and every pull request. The slow
# ones (end-to-end, database tests, migrations, the AI model list) are in
# manual.yml and run only when started from the Actions tab.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile # postinstall runs `prisma generate`
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm check:env
      # The pre-commit hook scans staged blobs; this re-scans every tracked
      # file so a secret committed with --no-verify (or before the hook was
      # installed) still fails the branch. See docs/rules/secrets.md.
      - run: pnpm check:secrets
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    env:
      # DIRECT_URL deliberately not set here — only the Prisma CLI's
      # migrate commands read it, never `next build` or the running app.
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
